# Deploys Agent Shopper on Render: ONE web service (the app, the three simulated shops at /shops/<name>, and the owner's
# control panel at /control) and a Postgres database.
#
# This first version runs the app in MOCK MODE (a scripted shopper and a pretend PayPal), so deploying it and
# testing it in the cloud costs no Anthropic or PayPal money. Going live is a few settings added in the Render
# dashboard (see "Going live" in README.md).
#
# Cost (from render.com/pricing, checked 2026-11-11): the web service on plan 0.5c-512mb is $7 a month and does not
# sleep; the database on plan 0.1c-256mb is $6 a month. That is $7 + $6 = $13 a month. (Before the shops moved into
# the app they were three more services at $7 each.) Render may also charge a workspace fee depending on your
# account's plan, which this file cannot know.
#
# Render checks this file when you create the Blueprint, and names any key it does not accept.

databases:
  - name: agent-shopper-db
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "17"
    databaseName: agent_shopper
    user: agent_shopper

services:
  # ---- the app: the screens and the API ----
  - type: web
    name: agent-shopper-app
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    # The build tools (vite) are development packages, so they are asked for by name.
    buildCommand: npm ci --include=dev && npm run web:build
    startCommand: node src/app/server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      # The built-in default is ONE shopper run at a time for the whole app, which would make a second visitor wait.
      - key: LIMIT_MAX_CONCURRENT
        value: "3"
      - key: DATABASE_URL
        fromDatabase:
          name: agent-shopper-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # How many proxies sit in front of the app. Measured with scripts/cloud-check.ts on 2026-11-11: Render's header
      # arrives as "<visitor>, <a Cloudflare address>", so 2 picks the visitor. With 1 every visitor would be counted
      # as a Cloudflare address and share one daily limit. Re-run the check if Render's setup ever changes.
      - key: TRUSTED_PROXY_HOPS
        value: "2"
      # Lets scripts/cloud-check.ts ask the app what address it sees. Read it in the dashboard (Environment) to run the check.
      - key: DIAG_TOKEN
        generateValue: true
      # The password for the control panel at /control (price drops, wrong items). Read it in the dashboard (Environment).
      # Open the panel at https://<the app's address>/control/?token=<that value>.
      - key: CONTROL_TOKEN
        generateValue: true

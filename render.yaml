# Deploys Agent Shopper on Render: the app, three simulated shops, the owner's control panel and a Postgres database.
#
# This first version runs the app in MOCK MODE (a scripted shopper and a pretend PayPal), so deploying it and
# testing it in the cloud costs no Anthropic or PayPal money. Going live is a few settings added in the Render
# dashboard (see "Going live" in README.md).
#
# Cost (from render.com/pricing, checked 2026-11-11): each web service on plan 0.5c-512mb is $7 a month and does not sleep;
# the database on plan 0.1c-256mb is $6 a month; the control panel is on the free plan ($0, it sleeps after 15 idle
# minutes, which does not matter for a private panel). That is 4 x $7 + $6 = $34 a month. Render may also charge a
# workspace fee depending on your account's plan, which this file cannot know.
#
# Everything is in one region because Render services only reach each other (and the database) privately inside a region.
# Render checks this file when you create the Blueprint, and names any key it does not accept.

databases:
  - name: agent-shopper-db
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "17"
    databaseName: agent_shopper
    user: agent_shopper

services:
  # ---- the app: the screens and the API ----
  - type: web
    name: agent-shopper-app
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    # The build tools (vite) are development packages, so they are asked for by name.
    buildCommand: npm ci --include=dev && npm run web:build
    startCommand: node src/app/server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: MOCK_SERVICES
        value: "1"
      # The built-in default is ONE shopper run at a time for the whole app, which would make a second visitor wait.
      - key: LIMIT_MAX_CONCURRENT
        value: "3"
      - key: DATABASE_URL
        fromDatabase:
          name: agent-shopper-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # How many proxies sit in front of the app. Measured with scripts/cloud-check.ts on 2026-11-11: Render's header
      # arrives as "<visitor>, <a Cloudflare address>", so 2 picks the visitor. With 1 every visitor would be counted
      # as a Cloudflare address and share one daily limit. Re-run the check if Render's setup ever changes.
      - key: TRUSTED_PROXY_HOPS
        value: "2"
      # Lets scripts/cloud-check.ts ask the app what address it sees. Read it in the dashboard (Environment) to run the check.
      - key: DIAG_TOKEN
        generateValue: true
      # The shops' private addresses, for example agent-shopper-northgear:10000 (the app adds http:// itself).
      - key: SHOP_NORTHGEAR_URL
        fromService:
          type: web
          name: agent-shopper-northgear
          property: hostport
      - key: SHOP_DEAL_ZONE_URL
        fromService:
          type: web
          name: agent-shopper-deal-zone
          property: hostport
      - key: SHOP_TRAILHEAD_URL
        fromService:
          type: web
          name: agent-shopper-trailhead
          property: hostport

  # ---- the three simulated shops: one site each, so an agent really visits separate sites ----
  - type: web
    name: agent-shopper-northgear
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    buildCommand: npm ci
    startCommand: node src/shops/server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: SHOP_ID
        value: northgear
      - key: DATABASE_URL
        fromDatabase:
          name: agent-shopper-db
          property: connectionString

  - type: web
    name: agent-shopper-deal-zone
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    buildCommand: npm ci
    startCommand: node src/shops/server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: SHOP_ID
        value: deal-zone
      - key: DATABASE_URL
        fromDatabase:
          name: agent-shopper-db
          property: connectionString

  - type: web
    name: agent-shopper-trailhead
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    buildCommand: npm ci
    startCommand: node src/shops/server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: SHOP_ID
        value: trailhead
      - key: DATABASE_URL
        fromDatabase:
          name: agent-shopper-db
          property: connectionString

  # ---- the owner's control panel: makes the shops misbehave on cue (price drops, wrong items) ----
  # Private. It will not start without CONTROL_TOKEN. Open it at https://<its address>/?token=<the token from Environment>.
  - type: web
    name: agent-shopper-control
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci
    startCommand: node src/shops/server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: CONTROL
        value: "1"
      - key: CONTROL_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agent-shopper-db
          property: connectionString

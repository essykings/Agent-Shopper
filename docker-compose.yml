# Local Postgres for development and tests. Start with: docker compose up -d
services:
  db:
    image: postgres:15
    container_name: agent-shopper-db
    environment:
      POSTGRES_USER: shopper
      POSTGRES_PASSWORD: shopper
      POSTGRES_DB: agent_shopper
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopper -d agent_shopper"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
